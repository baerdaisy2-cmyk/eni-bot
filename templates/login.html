<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — ENI Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<div class="gate">
  <div class="panel">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path class="body" d="M7.2 19.4c-2.6-3.4-1.6-8.2 2.2-11S18.9 5.3 22 8.1s3.6 7.8 1 11.2-7.6 4.9-11.6 3.3a10 10 0 0 1-4.2-3.2Z"/>
        <path class="body" d="M10.6 22.6 6.4 26.2"/>
        <path class="leaf" d="M22.4 6.6c1.6-1.9 3.6-2.6 5.6-2.3.3 2.1-.5 4-2.3 5.4-.9.7-1.9 1-2.9.9-.6-1.4-.7-2.8-.4-4Z"/>
        <circle class="seed" cx="15.4" cy="15" r="1.5"/>
      </svg>
    </div>
    <h1>ENI Monitor</h1>
    <p class="sub">sign in to reach the watchlist.</p>

    {% if error %}<p class="err">{{ error }}</p>{% endif %}

    <form method="post">
      <div class="field {{ 'bad' if error }}">
        <input name="user" id="user" placeholder=" " autocomplete="username" autofocus required>
        <label for="user">name</label>
      </div>
      <div class="field {{ 'bad' if error }}">
        <input name="password" id="password" type="password" placeholder=" " autocomplete="current-password" required>
        <label for="password">password</label>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div class="toasts" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
