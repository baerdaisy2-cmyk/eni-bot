<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>{% include "_head.html" %}<title>Sign in — VANTA</title></head>
<body>
<div class="gate">
  <div class="panel">
    <div class="wordmark">
      <svg class="mark" style="width:34px;height:34px" viewBox="0 0 28 28" aria-hidden="true">
        <path d="M4 5 L14 23 L24 5" fill="none" stroke="var(--yellow)" stroke-width="2.6"
              stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M1 14 H27" fill="none" stroke="var(--yellow)" stroke-width="1" opacity=".45"/>
        <rect x="12.4" y="19.4" width="3.2" height="3.2" fill="var(--yellow)"/>
      </svg>
    </div>
    <h1 style="font-size:24px;letter-spacing:.14em">VANTA</h1>
    <p class="sub">restricted access</p>

    {% if error %}<p class="err">{{ error }}</p>{% endif %}

    <form method="post">
      <div class="field {{ 'bad' if error }}">
        <label for="user">Operator</label>
        <input name="user" id="user" autocomplete="username" autofocus required>
      </div>
      <div class="field {{ 'bad' if error }}">
        <label for="password">Passcode</label>
        <input name="password" id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
