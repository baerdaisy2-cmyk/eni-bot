<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>{% include "_head.html" %}<title>Authenticate — RedTrak</title></head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <rect x="3" y="3" width="22" height="22" rx="6" fill="#F97316"/>
        <text x="14" y="19.5" font-family="Inter, sans-serif" font-size="15" font-weight="800"
              text-anchor="middle" fill="#0B0F19">R</text>
      </svg>
      <b>RedTrak</b>
    </div>

    <div class="login-terminal">
      <div>&gt; initialising secure channel</div>
      <div>&gt; tls handshake .......... <span class="ok">OK</span></div>
      <div>&gt; key exchange ........... <span class="ok">OK</span></div>
      <div>&gt; awaiting credentials</div>
    </div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <label class="login-label">Operator</label>
      <input class="login-input" name="user" autocomplete="username" required autofocus>

      <label class="login-label">Passphrase</label>
      <input class="login-input" type="password" name="password" autocomplete="current-password" required>

      <button class="login-btn" type="submit">Establish connection</button>
    </form>

    <div class="login-status">
      <span class="dot"></span> STATUS: ENCRYPTED CONNECTION · TLS 1.3
    </div>
  </div>
</div>

<style>
.login-body { background: #0B0F19; min-height: 100vh; display: grid; place-items: center; margin: 0; font-family: Inter, system-ui, sans-serif; }
.login-wrap { width: 100%; max-width: 420px; padding: 20px; }
.login-card {
  background: #161B22;
  border: 1px solid #232A36;
  border-radius: 14px;
  padding: 32px 28px;
}
.login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
.login-brand svg { width: 30px; height: 30px; }
.login-brand b { font-size: 18px; font-weight: 700; color: #E6EDF3; letter-spacing: -.01em; }

.login-terminal {
  background: #0B0F19;
  border: 1px solid #232A36;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 22px;
  font-family: ui-monospace, "JetBrains Mono", monospace;
  font-size: 11.5px;
  line-height: 1.7;
  color: #8B949E;
}
.login-terminal .ok { color: #22C55E; }

.login-error {
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(239,68,68,.08);
  border: 1px solid rgba(239,68,68,.3);
  color: #EF4444;
  font-size: 12.5px;
  margin-bottom: 16px;
  font-family: ui-monospace, monospace;
}

.login-label {
  display: block;
  font-size: 11px;
  color: #8B949E;
  text-transform: uppercase;
  letter-spacing: .12em;
  font-family: ui-monospace, monospace;
  margin-bottom: 6px;
  margin-top: 14px;
}
.login-input {
  width: 100%;
  padding: 11px 14px;
  border-radius: 8px;
  background: #0B0F19;
  border: 1px solid #232A36;
  color: #E6EDF3;
  font: inherit;
  font-size: 14px;
  box-sizing: border-box;
}
.login-input:focus { outline: none; border-color: #F97316; box-shadow: 0 0 0 3px rgba(249,115,22,.15); }

.login-btn {
  width: 100%;
  margin-top: 24px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #F97316;
  background: #F97316;
  color: #0B0F19;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  font-family: ui-monospace, monospace;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
}
.login-btn:hover { background: #FB923C; border-color: #FB923C; }

.login-status {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid #232A36;
  text-align: center;
  color: #8B949E;
  font-size: 10.5px;
  font-family: ui-monospace, monospace;
  letter-spacing: .05em;
}
.login-status .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #22C55E;
  margin-right: 6px;
  vertical-align: middle;
}
</style>
</body>
</html>
