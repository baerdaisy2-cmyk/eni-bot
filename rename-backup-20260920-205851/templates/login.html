<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>{% include "_head.html" %}<title>Authenticate — VANTA</title></head>
<body>
<div class="auth">
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <path d="M4 5 L14 23 L24 5" fill="none" stroke="var(--green)" stroke-width="2.4"
              stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M1 14 H27" fill="none" stroke="var(--cyan)" stroke-width="1" opacity=".6"/>
        <rect x="12.4" y="19.4" width="3.2" height="3.2" fill="var(--green)"/>
      </svg>
      <b>VANTA</b>
    </div>

    <div class="boot" aria-hidden="true"></div>

    {% if error %}<div class="err">&gt; {{ error }}</div>{% endif %}

    <form method="post" autocomplete="off">
      <div class="field">
        <label for="u">Operator</label>
        <input name="user" id="u" required autofocus autocapitalize="none"
               autocomplete="username" spellcheck="false">
      </div>
      <div class="field">
        <label for="p">Passphrase</label>
        <input name="password" id="p" type="password" required
               autocomplete="current-password">
        <button type="button" class="reveal" data-reveal="p" aria-label="Show password">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button class="btn primary" type="submit">Establish connection</button>
    </form>

    <div class="link-status"><i></i>STATUS: ENCRYPTED CONNECTION · TLS 1.3</div>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
